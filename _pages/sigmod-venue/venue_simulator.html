<style>
:root{--bg:#f5f7fa;--card:#fff;--accent:#e91e63;--accent2:#1976d2;--ok:#4caf50;--warn:#ff9800;--err:#e53935;--border:#ddd;--text:#333;--muted:#888;--row-alt:#fafbfc;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;}
header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:24px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
header h1{font-size:22px;font-weight:600;}
header .badge{background:var(--accent);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;}
header .sub{font-size:13px;opacity:.8;margin-top:4px;}
.container{max-width:1440px;margin:0 auto;padding:20px;}
.tabs{display:flex;gap:4px;background:#e0e0e0;padding:4px;border-radius:10px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:10px 18px;border:none;background:transparent;cursor:pointer;border-radius:8px;font-size:13px;font-weight:500;color:#555;transition:all .2s;}
.tab.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600;}
.tab:hover:not(.active){background:rgba(255,255,255,.5);}
.panel{display:none;}.panel.active{display:block;}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card h2{font-size:16px;margin-bottom:12px;color:var(--accent);display:flex;align-items:center;gap:8px;}
.card h3{font-size:14px;margin:12px 0 8px;color:var(--accent2);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#f0f2f5;padding:8px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);position:sticky;top:0;}
td{padding:7px 10px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:var(--row-alt);}
tr:hover{background:#e8f0fe;}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.st.ok{background:#e8f5e9;color:#2e7d32;}
.st.warn{background:#fff3e0;color:#e65100;}
.st.err{background:#ffebee;color:#c62828;}
.st.info{background:#e3f2fd;color:#1565c0;}
.st.enforced{background:#f3e5f5;color:#7b1fa2;}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin:12px 0;}
.room-chip{padding:8px 12px;border-radius:8px;font-size:12px;text-align:center;border:1px solid var(--border);}
.room-chip.used{background:#e8f5e9;border-color:#a5d6a7;}
.room-chip .cap{font-weight:700;font-size:14px;display:block;}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.setting{display:flex;flex-direction:column;gap:4px;}
.setting label{font-weight:600;font-size:12px;color:#555;}
.setting input{padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
.setting input:focus{outline:none;border-color:var(--accent);}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:#c2185b;}
.btn-secondary{background:var(--accent2);color:#fff;}.btn-secondary:hover{background:#1565c0;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0;}
.summary-box{background:#f8f9fa;border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;}
.summary-box .value{font-size:28px;font-weight:700;color:var(--accent);}
.summary-box .label{font-size:12px;color:var(--muted);margin-top:4px;}
.cl{list-style:none;}
.cl li{padding:8px 12px;margin:4px 0;border-radius:6px;font-size:13px;}
.cl li.err{background:#ffebee;border-left:3px solid var(--err);}
.cl li.warn{background:#fff3e0;border-left:3px solid var(--warn);}
.cl li.ok{background:#e8f5e9;border-left:3px solid var(--ok);}
.cl li.info{background:#e3f2fd;border-left:3px solid var(--accent2);}
.cl li.enforced{background:#f3e5f5;border-left:3px solid #7b1fa2;}
.email-item{padding:12px 16px;margin:8px 0;background:#f8f9fa;border-radius:8px;border-left:3px solid var(--accent2);}
.email-item .date{font-weight:700;font-size:12px;color:var(--accent);}
.email-item .title{font-weight:600;margin:4px 0;}
.email-item .body{font-size:12px;color:#555;}
.gantt-row{display:flex;align-items:center;margin:2px 0;}
.gantt-label{width:140px;flex-shrink:0;font-size:11px;font-weight:600;padding-right:8px;text-align:right;}
.gantt-bar-area{flex:1;position:relative;height:24px;background:#f0f2f5;border-radius:4px;}
.gantt-bar{position:absolute;height:20px;top:2px;border-radius:3px;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 4px;}
.gantt-header{display:flex;margin-bottom:4px;}
.gantt-header .gantt-label{font-size:10px;color:#888;}
.gantt-header .gantt-bar-area{display:flex;justify-content:space-between;font-size:10px;color:#888;}
.enforce-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin:12px 0;}
.enforce-card{padding:12px;border-radius:8px;border:1px solid var(--border);font-size:12px;}
.enforce-card.pass{background:#e8f5e9;border-color:#a5d6a7;}
.enforce-card.fail{background:#ffebee;border-color:#ef9a9a;}
.enforce-card.partial{background:#fff3e0;border-color:#ffcc80;}
.enforce-card .title{font-weight:700;margin-bottom:4px;}
.enforce-card .clause{color:var(--muted);font-size:11px;}
.enforce-card .result{margin-top:4px;font-weight:600;}
/* ── Program-at-a-Glance Grid (SIGMOD 2025 style) ── */
.pag-wrap{overflow-x:auto;margin:12px 0;}
.pag{border-collapse:collapse;font-size:11px;min-width:100%;}
.pag th,.pag td{border:1px solid #ccc;padding:0;text-align:center;vertical-align:top;position:relative;}
.pag th{background:#2c3e50;color:#fff;padding:6px 4px;font-size:11px;min-width:100px;position:sticky;top:0;z-index:2;}
.pag th.time-col{min-width:60px;width:60px;background:#1a252f;}
.pag .time-cell{background:#f8f9fa;font-weight:700;font-size:11px;padding:2px 4px;color:#333;white-space:nowrap;width:60px;position:sticky;left:0;z-index:1;}
.pag .empty{background:#f5f5f5;}
.pag .session-cell{color:#fff;font-size:10px;font-weight:600;padding:3px 4px;line-height:1.3;cursor:default;overflow:hidden;}
.pag .session-cell:hover{opacity:.85;}
.pag .session-cell .s-name{display:block;overflow:hidden;text-overflow:ellipsis;}
.pag .session-cell .s-cap{font-size:9px;opacity:.8;font-weight:400;}
.pag-legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:11px;}
.pag-legend span{display:inline-flex;align-items:center;gap:4px;}
.pag-legend .swatch{width:14px;height:14px;border-radius:3px;display:inline-block;}
.pag .prep-cell{background:repeating-linear-gradient(45deg,#e0e0e0,#e0e0e0 4px,#f5f5f5 4px,#f5f5f5 8px) !important;color:#555 !important;font-style:italic;border:1px dashed #bbb !important;}
.pag .not-booked{background:repeating-linear-gradient(45deg,#fce4ec,#fce4ec 4px,#fff 4px,#fff 8px) !important;color:#c62828 !important;font-size:9px !important;font-style:italic;border:1px dashed #e57373 !important;}
@media(max-width:768px){.container{padding:12px;}.tabs{flex-direction:column;}.settings-grid{grid-template-columns:1fr;}}
</style>

// Source: COEX Contract CEC2025070020 (16/Mar/2026)
//   Att.1: Quotation | Att.2: Terms & Conditions (T&C) | Att.3: Operation Regulation (Op.Reg.)
//   + Key Terms and Guidelines
const CONTRACT_RULES = [
  // ─── A. RENTAL & PAYMENT ─────────────────────────────────
  {id:'A1',cat:'Rental & Payment',vtype:'cost',clause:'Key Terms #1',title:'Rental hours: 09:00-18:00',desc:'Standard rental is full day 09:00-18:00. Extended hours require advance discussion and additional fees.',check:p=>{
    let v=[];
    for(const[day,d]of Object.entries(p)){if(day.startsWith('_'))continue;for(const sl of d.slots){
      const h=parseInt(sl.time.split('-')[0]);
      const hasReal=sl.sessions.some(x=>x.need>0&&x.room!=='N/A');
      if(hasReal&&(h<9||h>=18)){
        const isEve=sl.label.includes('Evening')||sl.label.includes('Reception')||sl.label.includes('Banquet');
        v.push(`${day} ${sl.time}: ${sl.label}${isEve?' — evening event, extended-hour arrangement needed':' — outside standard hours'}`);}
    }}
    return v.length?{pass:false,notes:v}:{pass:true,notes:['All daytime sessions within 09:00-18:00']};
  }},
  {id:'A2',cat:'Rental & Payment',vtype:'action',clause:'T&C Art.1',title:'Payment schedule (10% / 40% / 50%+VAT)',desc:'Down payment 10% at signing; 40% by 3 months before; 50%+VAT by 7 days before.',check:()=>{
    const today=new Date('2026-04-08'),due1=new Date('2026-03-23');
    return today>due1?{pass:false,notes:[`Down payment KRW 25,944,000 due ${due1.toISOString().slice(0,10)} — OVERDUE. Contract shows Paid Amount = 0.`,`Interim KRW 103,776,000 due 2028-03-17`,`Balance KRW 155,664,000 due 2028-06-10`,`Bank: Shinhan Bank 140-011-634273, SWIFT: SHBKKRSE`]}:{pass:true,notes:['On schedule']};
  }},
  {id:'A3',cat:'Rental & Payment',vtype:'cost',clause:'Contract Note + v1.7 Addendum',title:'2026 rates + Auditorium addendum',desc:'Base KRW 285,384,000 (CEC2025070020) + Auditorium addendum KRW 168,960,000 (incl. VAT). v1.7 total KRW 454,344,000.',check:()=>({pass:'partial',notes:['Base contract: Meeting Rooms KRW 259,440,000 + VAT 10% = KRW 285,384,000','v1.7 Auditorium addendum: 9.6M (D-1 6/17) + 6×24M (6/18-6/23) = 153.6M + VAT 15.36M = KRW 168,960,000','v1.7 TOTAL: KRW 454,344,000 (≈ $302,896 @1,500/USD)','2028 projected with 3-5% annual: +6-10% → KRW 482M-500M','Contract type: Meeting Room Rental Only, NO F&B required']})},
  {id:'A4',cat:'Rental & Payment',vtype:'info',clause:'T&C Art.3-4',title:'Cancellation & termination penalties',desc:'Full cancellation forfeits all payments. Partial reduction: 10% (90+ days), 50% (8-89 days), 100% (< 7 days).',check:()=>({pass:'partial',notes:['Full cancellation: all rent paid becomes penalty','Partial reduction 90+ days: 10% of difference','Partial reduction 8-89 days: 50%','Partial reduction < 7 days: 100%','Force majeure (Art.9): no penalty, rent returned']})},
  // ─── B. SPACE & SETUP ────────────────────────────────────
  {id:'B1',cat:'Space & Setup',vtype:'cost',clause:'Key Terms #2',title:'50% surcharge for non-meeting use',desc:'Exhibitions, posters, and other non-meeting uses incur 50% surcharge on rental.',check:p=>{
    const items=[];
    for(const[day,d]of Object.entries(p)){if(day.startsWith('_'))continue;for(const sl of d.slots){for(const s of sl.sessions){
      if(s.style==='Flow'||s.name.includes('Poster'))items.push(`${day}: ${s.name} in ${s.room} — 50% surcharge`);
      if(s.name.includes('Demo')&&s.style==='U-Shape')items.push(`${day}: ${s.name} in ${s.room} — verify if demo = exhibition`);

    return items.length?{pass:false,notes:items}:{pass:true,notes:['No non-meeting use detected']};

  {id:'B2',cat:'Space & Setup',vtype:'cost',clause:'Op.Reg. Art.8',title:'Room setup: 1 free, changes cost extra',desc:'Initial setup included. Any reconfiguration during event incurs separate fees per change.',check:p=>{
    const ch=[];
    for(const[day,d]of Object.entries(p)){if(day.startsWith('_'))continue;for(const sl of d.slots){for(const s of sl.sessions){

    }}}
    return ch.length?{pass:false,notes:[`${ch.length} partition changes — each incurs extra fee:`,...ch]}:{pass:true,notes:['No reconfigurations']};

  {id:'B3',cat:'Space & Setup',vtype:'conflict',clause:'Quotation',title:'Rooms 206, 209 unavailable on Friday',desc:'Per quotation, these rooms are not booked on June 23 (Friday).',check:p=>{

// ══════════════════════════════════════════════════════════
//  VALIDATION
// ══════════════════════════════════════════════════════════
function validate(P){
  const issues=[];
  for(const[day,data]of Object.entries(P)){
    if(day.startsWith('_'))continue;
    const qDay=QUOTATION[day];
    for(const slot of data.slots){for(const sess of slot.sessions){
      if(!sess.need||sess.room==='N/A'||sess.room.includes('Lobby'))continue;
      const rids=sess.room.split(/[ +,]+/).filter(r=>ROOMS[r]);
      // ── Capacity check: SUM across all rooms in multi-room sessions ──
      function getCap(rm,style){return style==='TH'?rm.th:style==='RD'?rm.rd:style==='CL'?rm.cl:style==='U-Shape'?Math.floor(rm.th*.4):rm.th;}
      if(rids.length===1){
        const rm=ROOMS[rids[0]];if(rm){
          const cap=getCap(rm,sess.style);
          if(sess.need>cap){const d=sess.need-cap;
            issues.push({day,time:slot.time,sev:d>cap*.15?'err':'warn',
              msg:`${sess.name}: needs ${sess.need} (${sess.style}) but ${rm.name} capacity is ${cap} — ${d} short`});}
        }
      } else if(rids.length>1){
        const totalCap=rids.reduce((sum,rid)=>{const rm=ROOMS[rid];return sum+(rm?getCap(rm,sess.style):0);},0);
        if(sess.need>totalCap){const d=sess.need-totalCap;
          issues.push({day,time:slot.time,sev:d>totalCap*.15?'err':'warn',
            msg:`${sess.name}: needs ${sess.need} (${sess.style}) but combined ${rids.join('+')} capacity is ${totalCap} — ${d} short`});}
      }
      // ── Quotation check: handle subset rooms (101-104 ⊂ 101-105, 202-203 ⊂ 201-203) ──
      if(qDay){for(const rid of rids){
        const inQ=qDay.rooms[rid];
        // Check if rid is an individual room that's part of a booked combined room
        const partOf=Object.keys(qDay.rooms).some(br=>{const r=ROOMS[br];return r&&r.parts&&r.parts.includes(rid);});
        // Check if rid is a combined room whose parts are ALL covered by a booked larger room
        const subsetOf=!inQ&&!partOf&&ROOMS[rid]&&ROOMS[rid].parts?
          Object.keys(qDay.rooms).some(br=>{const r=ROOMS[br];return r&&r.parts&&ROOMS[rid].parts.every(p=>r.parts.includes(p));}):false;
        if(!inQ&&!partOf&&!subsetOf){
          issues.push({day,time:slot.time,sev:'warn',msg:`${sess.name}: Room ${rid} NOT in contract quotation for ${day}`});
        }
      }}
      if(sess.warn)issues.push({day,time:slot.time,sev:'err',msg:sess.warn});
    }}
  }
  // ── Room double-booking check (same time slot, overlapping rooms) ──
  for(const[day,data]of Object.entries(P)){
    if(day.startsWith('_'))continue;// skip metadata
    for(const slot of data.slots){
      const roomMap={};// room → session name
      for(const sess of slot.sessions){
        if(!sess.need&&!sess.name.includes('Workshop')&&!sess.name.includes('DaMoN')&&!sess.name.includes('Tutorial'))continue;
        if(sess.room==='N/A'||sess.room.includes('Lobby'))continue;
        const parts=sess.room.split(/[+,]/).map(r=>r.trim());
        for(const rp of parts){
          const expanded=expandRoom(rp);
          if(!expanded.length&&ROOMS[rp])expanded.push(rp);
          for(const phys of expanded){
            if(roomMap[phys]){
              issues.push({day,time:slot.time,sev:'err',
                msg:`Room ${phys} double-booked: "${roomMap[phys]}" and "${sess.name}" both assigned`});
            } else roomMap[phys]=sess.name;
          }
        }
      }
    }
  }
  // Structural checks
  issues.push({day:'06-22',time:'14:00-17:30',sev:'info',msg:'11 parallel sessions use 11 session rooms. Backup: 204 (24 TH, storage), 207 (36 TH, organizing comm.) are booked but available if needed.'});
  issues.push({day:'06-21',time:'ALL DAY',sev:'info',msg:'Rooms 206/209 in poster configuration all day (poster boards set up Tuesday evening). No regular sessions scheduled in these rooms.'});
  if(CFG.attendees>CFG.banquetCap){
    issues.push({day:'06-21',time:'19:00',sev:CFG.attendees>CFG.banquetCap*1.3?'err':'warn',
      msg:`Banquet: ${CFG.banquetCap} seats vs ${CFG.attendees} expected attendees (${Math.round(CFG.banquetCap/CFG.attendees*100)}% coverage)`});
  }
  const lunchGap=CFG.attendees-(CFG.lunchRoundsCap+CFG.overflowCap);
  if(lunchGap>0)issues.push({day:'06-21',time:'12:30',sev:'warn',msg:`Wednesday lunch: ${CFG.attendees} attendees vs ${CFG.lunchRoundsCap+CFG.overflowCap} seats (${lunchGap} short)`});

  // ── Session slot capacity check (from _slots metadata) ──
  const sl=P._slots||{research:{total:0,needed:0,overflow:0,empty:0},industry:{total:0,needed:0,overflow:0,empty:0}};
  const rMargin=sl.research.total-sl.research.needed;
  const iMargin=sl.industry.total-sl.industry.needed;

  issues.push({day:'GLOBAL',time:'Tue-Thu',sev:rMargin<0?'err':rMargin<=2?'warn':'ok',
    msg:`Research: ${sl.research.needed} sessions needed (${CFG.researchPapers} papers ÷ ${CFG.papersPerSession}/session @ ${CFG.minPerPaper}min), ${sl.research.total} slots available → ${rMargin>=0?'+':''}${rMargin} margin${rMargin<0?` — ${-rMargin} sessions CANNOT be scheduled!`:rMargin>0?` — ${sl.research.empty} slots shown as [available]`:''}`});
  issues.push({day:'GLOBAL',time:'Tue-Thu',sev:iMargin<0?'err':iMargin<=1?'warn':'ok',
    msg:`Industry: ${sl.industry.needed} sessions needed (${CFG.industryPapers} papers ÷ ${CFG.papersPerSession}/session), ${sl.industry.total} slots available → ${iMargin>=0?'+':''}${iMargin} margin${iMargin<0?` — ${-iMargin} sessions CANNOT be scheduled!`:''}`});

  return issues;
}

      ${fields.map(([k,lbl])=>`<div class="setting"><label>${lbl}</label><input type="number" id="s-${k}" value="${CFG[k]}" step="${k==='annualPct'?0.5:1}"></div>`).join('')}

  // Build lunch table with plain string concatenation (avoids nested template issues)

  lH+='<table><tr><th>Day</th><th>Lunch Type</th><th>Pax</th><th>Est. Cost</th></tr>';

    var k=d[0],lbl=d[1],v=CFG[k];

    var cost=v===0?0:v===2?CFG.priceDosirak*pax:CFG.priceBuffet*pax;
    if(v>0)lT+=cost;
    var opts='';lunchOpts.forEach(function(o,i){opts+='<option value="'+i+'"'+(i===v?' selected':'')+'>'+o+'</option>';});
    lH+='<tr><td>'+lbl+'</td><td><select id="s-'+k+'" style="padding:6px;border-radius:4px;border:1px solid var(--border);font-size:13px;">'+opts+'</select></td>';
    lH+='<td style="text-align:right">'+pax.toLocaleString()+'</td>';
    lH+='<td style="text-align:right">'+(v===0?'-':'KRW '+cost.toLocaleString()+' ($'+Math.round(cost/CFG.exchangeRate).toLocaleString()+')')+'</td></tr>';
  });
  var nDays=lunchDays.filter(function(d){return CFG[d[0]]>0;}).length;
  lH+='<tr style="font-weight:700;border-top:2px solid var(--border)"><td colspan="3">Total Lunch Cost ('+nDays+' days)</td>';
  lH+='<td style="text-align:right">KRW '+lT.toLocaleString()+' ($'+Math.round(lT/CFG.exchangeRate).toLocaleString()+')</td></tr></table></div>';
  el.innerHTML+=lH;
  el.innerHTML+=`
  <div class="card"><h2>COEX Room Inventory</h2><table>
    <tr><th>ID</th><th>Name</th><th>Floor</th><th>Classroom</th><th>Theater</th><th>Rounds</th></tr>
    ${Object.entries(ROOMS).filter(([id,r])=>!r.parts||['101-105','201-203','101-104','101-102','201-202','101-103','202-203'].includes(id)).map(([id,r])=>
      `<tr><td><strong>${id}</strong></td><td>${r.name}</td><td>${r.floor}F</td><td>${r.cl}</td><td>${r.th}</td><td>${r.rd||'-'}</td></tr>`
    ).join('')}
  </table></div>
  <div class="card"><h2>Lobby Capacity Simulation</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Interactive simulation of Grand Ballroom Lobby (1F, ~500 pax) and ASEM Ballroom Lobby (2F, ~300 pax) capacity for coffee breaks, standing buffets, and receptions.</p>
    <a href="coex-lobby-simulation.html" target="_blank" class="btn btn-secondary" style="display:inline-block;text-decoration:none;">Open Lobby Simulation Tool</a>
  </div>`;
}

// Session type → color mapping (SIGMOD 2025 style)
const TYPE_COLORS={
  // Prep/Setup — must be FIRST (longer keys matched before shorter ones like "Demo", "Banquet")
  'Demo A Setup':'#b0bec5','Demo B Setup':'#b0bec5','Banquet Prep':'#b0bec5','Reception Prep':'#b0bec5',
  'Poster Board':'#b0bec5','poster config':'#b0bec5','Partition':'#b0bec5','Office':'#b0bec5','Storage':'#b0bec5',
  // Session types
  'Keynote':'#c0392b','Opening':'#c0392b','Award':'#c0392b','Plenary':'#c0392b',
  'PODS Session':'#2980b9','PODS Business':'#2c3e50','PODS Opening':'#2980b9',
  'SIGMOD Session':'#27ae60','Research':'#27ae60','Industry':'#e67e22','Sponsor':'#e67e22',
  'Tutorial':'#8e44ad','Workshop':'#16a085','DaMoN':'#16a085',
  'Demo':'#d35400','Panel':'#2c3e50','DEI':'#e91e63','Student':'#9b59b6','SRC':'#9b59b6',
  'Poster':'#e67e22','Lunch':'#607d8b','Coffee':'#78909c','Break':'#78909c','Buffet':'#607d8b',
  'Setup':'#b0bec5',
  'Reception':'#34495e','Banquet':'#c0392b','Warmup':'#34495e','Symposium':'#8e44ad',
  'default':'#7f8c8d',
};
function sessColor(name){
  for(const[key,col]of Object.entries(TYPE_COLORS)){if(name.includes(key))return col;}
  return TYPE_COLORS.default;
}

// Expand combined rooms to physical rooms used
function expandRoom(rid){
  // Map combined room IDs to their display columns
  const combos={
    '101-105':['101','102','103','104','105'],
    '101-104':['101','102','103','104'],
    '101-103':['101','102','103'],
    '101-102':['101','102'],
    '201-203':['201','202','203'],
    '201-202':['201','202'],
    '202-203':['202','203'],
  };
  if(combos[rid])return combos[rid];
  if(ROOMS[rid])return[rid];
  return[];
}

// All possible display columns for the grid (ordered by floor/number)
const GRID_COLS_1F=['101','102','103','104','105'];
const GRID_COLS_2F=['201','202','203','204','205','206','207','209','210','211'];
const GRID_COLS_3F=['auditorium']; // v1.7: 3F Auditorium (plenary venue)

function renderDay(dayKey,P){
  const data=P[dayKey];if(!data)return;
  const panelId='day-'+{'06-17':'sat','06-18':'sun','06-19':'mon','06-20':'tue','06-21':'wed','06-22':'thu','06-23':'fri'}[dayKey];
  const el=document.getElementById(panelId);if(!el)return;
  const qDay=QUOTATION[dayKey];const issues=validate(P).filter(i=>i.day===dayKey);

  // Determine which rooms are booked this day
  const bookedRooms=new Set();
  if(qDay)for(const rid of Object.keys(qDay.rooms)){expandRoom(rid).forEach(r=>bookedRooms.add(r));}
  // Columns = ALL rooms (show unbooked ones with red stripe)
  const allPhysical=[...GRID_COLS_1F,...GRID_COLS_2F,...GRID_COLS_3F];
  // Add GBR Lobby and ASEM Lobby as virtual columns
  const hasGBRLobby=data.slots.some(sl=>sl.sessions.some(s=>s.room&&s.room.includes('GBR Lobby')&&s.need>0));
  const c1=allPhysical.filter(c=>{const r=ROOMS[c];return r&&r.floor===1;});
  const c2=allPhysical.filter(c=>{const r=ROOMS[c];return r&&r.floor===2;});
  const c3=allPhysical.filter(c=>{const r=ROOMS[c];return r&&r.floor===3;}); // v1.7: Auditorium
  // Insert ASEM Lobby after 203 (always shown), GBR Lobby after 1F rooms
  const c2WithAsem=[];
  for(const col of c2){c2WithAsem.push(col);if(col==='203')c2WithAsem.push('ASEM Lobby');}
  if(!c2WithAsem.includes('ASEM Lobby'))c2WithAsem.push('ASEM Lobby');
  let allCols=[...c1];
  if(hasGBRLobby) allCols.push('GBR Lobby');
  allCols.push(...c3); // Auditorium between 1F and 2F (highlighted as plenary venue)
  allCols.push(...c2WithAsem);

  // Build time grid: 30-min slots from earliest to latest
  let minH=24,maxH=0;
  for(const sl of data.slots){
    const[s,e]=sl.time.split('-');
    const sh=parseInt(s);const eh=parseInt(e);
    if(sh<minH)minH=sh;if(eh>maxH)maxH=eh;
  }
  minH=Math.max(7,minH);maxH=Math.min(23,maxH+1);
  const timeSlots=[];
  for(let h=minH;h<maxH;h++){timeSlots.push(`${String(h).padStart(2,'0')}:00`);timeSlots.push(`${String(h).padStart(2,'0')}:30`);}

  // Build cell map: grid[timeIdx][colIdx] = {session, rowspan, isStart}
  const grid=Array.from({length:timeSlots.length},()=>Array(allCols.length).fill(null));
  const occupied=Array.from({length:timeSlots.length},()=>Array(allCols.length).fill(false));

  function timeToIdx(t){
    const[h,m]=t.split(':').map(Number);
    const target=`${String(h).padStart(2,'0')}:${m<30?'00':'30'}`;
    return timeSlots.indexOf(target);
  }
  function timeToIdxEnd(t){
    const[h,m]=t.split(':').map(Number);
    const target=`${String(h).padStart(2,'0')}:${m<=0?'00':m<=30?'30':'30'}`;
    let idx=timeSlots.indexOf(target);
    if(idx<0)idx=timeSlots.length;
    return idx;
  }

  for(const slot of data.slots){
    const[startT,endT]=slot.time.split('-');
    for(const sess of slot.sessions){
      if(!sess.need&&!sess.name.includes('Partition')&&!sess.name.includes('Setup')&&!sess.name.includes('Office')&&!sess.name.includes('Banquet Prep')&&!sess.name.includes('Reception Prep')&&!sess.name.includes('poster config')&&!sess.name.includes('Poster Board')&&!sess.name.includes('Demo A Setup')&&!sess.name.includes('Demo B Setup'))continue;
      if(sess.room==='N/A')continue;

      const sIdx=timeToIdx(startT.trim());
      const eIdx=timeToIdxEnd(endT.trim());
      if(sIdx<0)continue;
      const rowspan=Math.max(1,eIdx-sIdx);

      // Determine which columns this session spans
      let sessCols=[];
      const roomParts=sess.room.split(/[+,]/).map(r=>r.trim());
      for(const rp of roomParts){
        if(rp==='ASEM Lobby'||rp.includes('ASEM Lobby')){
          const li=allCols.indexOf('ASEM Lobby');
          if(li>=0)sessCols.push(li);
        } else if(rp.includes('Lobby')||rp==='GBR Lobby'){
          const li=allCols.indexOf('GBR Lobby');
          if(li>=0)sessCols.push(li);
        } else {
          const expanded=expandRoom(rp);
          for(const er of expanded){const ci=allCols.indexOf(er);if(ci>=0)sessCols.push(ci);}
        }
      }
      if(!sessCols.length)continue;
      sessCols.sort((a,b)=>a-b);

      // Check if columns are contiguous for colspan
      const minC=sessCols[0],maxC=sessCols[sessCols.length-1];
      const colspan=maxC-minC+1;

      // Place in grid
      const isEmptySlot=sess.name.includes('[Slot')||sess.name.includes('[Ind.');
      if(sIdx>=0&&sIdx<grid.length&&!occupied[sIdx][minC]){
        grid[sIdx][minC]={
          name:sess.name,need:sess.need,style:sess.style,
          room:sess.room,note:sess.note,warn:sess.warn,
          rowspan,colspan,
          color:isEmptySlot?'#e0e0e0':sessColor(sess.name),
          empty:isEmptySlot,
        };
        // Mark occupied cells
        for(let r=sIdx;r<Math.min(sIdx+rowspan,grid.length);r++){
          for(let c=minC;c<=maxC;c++){occupied[r][c]=true;}
        }
      }
    }
  }

  // Render grid HTML
  let gridHTML=`<table class="pag"><thead><tr><th class="time-col">Time</th>`;
  // Column headers — mark unbooked rooms
  for(const col of allCols){
    const rm=ROOMS[col];
    const booked=col==='GBR Lobby'||col==='ASEM Lobby'||bookedRooms.has(col);
    const label=col==='GBR Lobby'?'GBR<br>Lobby':col==='ASEM Lobby'?'ASEM<br>Lobby':col==='auditorium'?'Auditorium<br><span style="font-size:9px;opacity:.7">3F</span>':`${col}`;
    const sub=rm?`<br><span style="font-size:9px;font-weight:400;opacity:.7">${rm.th}TH${col==='auditorium'?' · LED':''}</span>`:'';
    const hdrStyle=booked?(col==='auditorium'?'background:#7b1fa2;color:#fff;':''):`background:#e57373;color:#fff;`;
    gridHTML+=`<th style="${hdrStyle}">${label}${sub}${booked?'':'<br><span style="font-size:8px;">NOT BOOKED</span>'}</th>`;
  }
  gridHTML+=`</tr></thead><tbody>`;

  for(let r=0;r<timeSlots.length;r++){
    gridHTML+=`<tr><td class="time-cell">${timeSlots[r]}</td>`;
    for(let c=0;c<allCols.length;c++){
      if(grid[r][c]){
        const g=grid[r][c];
        const capInfo=g.need?`${g.need} ${g.style}`:'';
        const warnStyle=g.warn?'border:2px solid var(--err);':'';
        const emptyStyle=g.empty?'border:2px dashed #999;color:#666;':'';
        const isPrep=g.color==='#b0bec5';
        const prepClass=isPrep?' prep-cell':'';
        gridHTML+=`<td class="session-cell${prepClass}" rowspan="${g.rowspan}" colspan="${g.colspan}" style="${isPrep?'':'background:'+g.color+';'}${warnStyle}${emptyStyle}" title="${g.name}\n${g.room} | ${capInfo}${g.note?'\n'+g.note:''}${g.warn?'\n⚠ '+g.warn:''}">
          <span class="s-name">${g.name}</span>
          ${capInfo?`<span class="s-cap">${capInfo}</span>`:''}
        </td>`;
      } else if(!occupied[r][c]){
        // Empty cell — check if room is booked or not
        const colName=allCols[c];
        const isBooked=colName==='GBR Lobby'||colName==='ASEM Lobby'||bookedRooms.has(colName);
        if(isBooked){
          gridHTML+=`<td class="empty"></td>`;
        } else {
          gridHTML+=`<td class="not-booked"></td>`;
        }
      }
      // If occupied by a rowspan/colspan from above, skip (no <td>)
    }
    gridHTML+=`</tr>`;
  }
  gridHTML+=`</tbody></table>`;

  // Legend
  const legendTypes=['Keynote','SIGMOD Session','PODS Session','Tutorial','Workshop','Demo','Panel','Poster','Industry','Lunch','Coffee','Reception','Banquet'];
  const prepSwatch='repeating-linear-gradient(45deg,#e0e0e0,#e0e0e0 3px,#f5f5f5 3px,#f5f5f5 6px)';
  const legendHTML=legendTypes.map(t=>`<span><span class="swatch" style="background:${sessColor(t)}"></span>${t}</span>`).join('')
    +`<span><span class="swatch" style="background:${prepSwatch};border:1px dashed #bbb;"></span>Prep / Setup</span>`
    +`<span><span class="swatch" style="background:repeating-linear-gradient(45deg,#fce4ec,#fce4ec 3px,#fff 3px,#fff 6px);border:1px dashed #e57373;"></span>Not Booked</span>`;

  // v1.6 proposal grid uses its own time range (v1.6 program differs from current v1.7)
  let v16TimeSlots=timeSlots;
  const v16Data=PROPOSAL_V16[dayKey];
  if(v16Data){
    let v16Min=24,v16Max=0;
    for(let i=1;i<v16Data.length;i++){
      const tr=v16Data[i][0].split('-');if(tr.length<2)continue;
      const sh=parseInt(tr[0]),eh=parseInt(tr[1]);
      if(sh<v16Min)v16Min=sh;if(eh>v16Max)v16Max=eh;
    }
    v16Min=Math.max(7,v16Min);v16Max=Math.min(23,v16Max+1);
    v16TimeSlots=[];
    for(let h=v16Min;h<v16Max;h++){v16TimeSlots.push(`${String(h).padStart(2,'0')}:00`);v16TimeSlots.push(`${String(h).padStart(2,'0')}:30`);}
  }

  el.innerHTML=`
  <div class="card"><h2>${data.label}</h2>
    ${data.note?`<p style="color:var(--warn);font-size:12px;margin-bottom:8px;font-weight:600;">${data.note}</p>`:''}
    <h3>Rooms in Contract Quotation</h3>
    <div class="room-grid">
      ${qDay?Object.entries(qDay.rooms).map(([rid,info])=>{const rm=ROOMS[rid];
        return`<div class="room-chip used"><span class="cap">${rid}</span>${rm?`CL:${rm.cl} TH:${rm.th}${rm.rd?' RD:'+rm.rd:''}`:''}<br>
          <small>KRW ${(info.krw/1000000).toFixed(1)}M</small>${info.remark?`<br><small style="color:var(--accent)">${info.remark}</small>`:''}
        </div>`;}).join(''):'<p>No rooms booked</p>'}
    </div>
    ${issues.length?`<h3>Issues</h3><ul class="cl">${issues.map(i=>`<li class="${i.sev}"><strong>[${i.time}]</strong> ${i.msg}</li>`).join('')}</ul>`
      :'<p style="color:var(--ok);font-weight:600;margin-top:12px;">No issues for this day.</p>'}
  </div>
  <div class="card"><h2>Program at a Glance</h2>
    <div style="margin-bottom:8px;display:flex;gap:8px;">
      <button class="btn btn-primary" style="padding:6px 14px;font-size:12px;" onclick="toggleProposal('${dayKey}','current')">Current</button>
      <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px;" onclick="toggleProposal('${dayKey}','v16')">Proposal v1.6</button>
      <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px;" onclick="toggleProposal('${dayKey}','v15')">Proposal v1.5</button>
    </div>
    <div id="proposal16-${dayKey}" style="display:none;">
      <p style="font-size:11px;color:var(--accent);margin-bottom:8px;font-weight:600;">Proposal v1.6 (computed program — 250 papers / 11 tutorials / 280 posters)</p>
      <div class="pag-legend">${legendHTML}</div>
      <div class="pag-wrap">${buildProposalGrid(dayKey,allCols,v16TimeSlots,bookedRooms,PROPOSAL_V16)}</div>
    </div>
    <div id="proposal-${dayKey}" style="display:none;">
      <p style="font-size:11px;color:var(--accent);margin-bottom:8px;font-weight:600;">Proposal v1.5 (from PPT) — original hypothetical program</p>
      <div class="pag-legend">${legendHTML}</div>
      <div class="pag-wrap">${buildProposalGrid(dayKey,allCols,timeSlots,bookedRooms)}</div>
    </div>
    <div id="current-${dayKey}">
    <p style="font-size:11px;color:var(--muted);margin-bottom:8px;">Columns = all rooms. Grey = booked but unused. Red stripe = not booked.</p>
    <div class="pag-legend">${legendHTML}<span><span class="swatch" style="background:#e0e0e0;border:2px dashed #999;"></span>Available Slot (unfilled)</span><span><span class="swatch" style="background:#f5f5f5;border:1px solid #ccc;"></span>Room Unused</span></div>
    <div class="pag-wrap">${gridHTML}</div>
    </div><!-- end current -->
  </div>
  <div class="card"><h2>Schedule Detail</h2><table>
    <tr><th>Time</th><th>Block</th><th>Session</th><th>Need</th><th>Style</th><th>Room</th><th>Cap</th><th>Status</th></tr>
    ${data.slots.map(slot=>slot.sessions.map(sess=>{
      let cap='-',status='';
      const rids=sess.room.split(/[ +,]+/).filter(r=>ROOMS[r]);
      if(rids.length&&sess.need>0){const rm=ROOMS[rids[0]];if(rm){
        cap=sess.style==='TH'?rm.th:sess.style==='RD'?rm.rd:sess.style==='CL'?rm.cl:sess.style==='U-Shape'?Math.floor(rm.th*.4):rm.th;
        status=sess.need<=cap?'<span class="st ok">OK</span>':sess.need<=cap*1.15?'<span class="st warn">Tight</span>':'<span class="st err">Over</span>';
      }}
      const isEmpty=sess.name&&(sess.name.includes('[Slot')||sess.name.includes('[Ind.'));
      if(isEmpty)status='<span class="st info">AVAILABLE</span>';
      else if(!sess.need)status='<span class="st info">Setup</span>';
      const rowStyle=isEmpty?'style="background:#f0f0f0;color:#999;"':'';
      return`<tr ${rowStyle}><td>${slot.time}</td><td>${slot.label}</td>
        <td>${sess.name}${sess.note?` <small style="color:var(--muted)">(${sess.note})</small>`:''}</td>
        <td>${sess.need||'-'}</td><td>${sess.style}</td><td><strong>${sess.room}</strong></td><td>${cap}</td><td>${status}</td></tr>`;
    }).join('')).join('')}
  </table></div>`;
}

function toggleProposal(dayKey,view){
  // Backward-compat: boolean true -> v1.5, false -> current
  if(view===true)view='v15';else if(view===false||view===undefined)view='current';
  var cur=document.getElementById('current-'+dayKey);
  var p15=document.getElementById('proposal-'+dayKey);
  var p16=document.getElementById('proposal16-'+dayKey);
  if(!cur)return;
  cur.style.display=view==='current'?'block':'none';
  if(p15)p15.style.display=view==='v15'?'block':'none';
  if(p16)p16.style.display=view==='v16'?'block':'none';
}
function propColor(c){
  if(!c)return '';
  if(c.includes('Partition')||c.includes('Prep'))return '#b0bec5';
  if(c.includes('Coffee')||c.includes('Lunch'))return '#607d8b';
  if(c.includes('Banquet'))return '#c0392b';
  if(c.includes('Keynote')||c.includes('Opening')||c.includes('Award'))return '#c0392b';
  if(c.includes('PODS'))return '#2980b9';
  if(c.includes('Tutorial'))return '#8e44ad';
  if(c.includes('Demo'))return '#d35400';
  if(c.includes('Industry'))return '#e67e22';
  if(c.includes('Panel')||c.includes('DEI')||c.includes('SRC')||c.includes('Student'))return '#9b59b6';
  if(c.includes('Poster'))return '#e67e22';
  if(c.includes('Reception')||c.includes('Warmup'))return '#34495e';
  return '#27ae60';
}
function buildProposalGrid(dayKey,allCols,timeSlots,bookedRooms,dataset){
  var pData=(dataset||PROPOSAL)[dayKey];
  if(!pData)return '<p style="color:var(--muted);">No proposal data for this day.</p>';
  // Build a cell map: propGrid[timeIdx][colIdx] = {text, rowspan, color}
  var propCols=pData[0].slice(1);// column headers from proposal
  var grid=Array.from({length:timeSlots.length},function(){return Array(allCols.length).fill(null);});
  var occ=Array.from({length:timeSlots.length},function(){return Array(allCols.length).fill(false);});
  function tIdx(t){var p=t.split(':');var target=String(parseInt(p[0])).padStart(2,'0')+':'+(parseInt(p[1])<30?'00':'30');return timeSlots.indexOf(target);}
  // Map proposal columns to allCols indices
  var colMap={};
  propCols.forEach(function(pc,i){var ci=allCols.indexOf(pc);if(ci>=0)colMap[i]=ci;});
  // Place proposal sessions — supports "101-105:text" colspan syntax
  for(var r=1;r<pData.length;r++){
    var row=pData[r];
    var times=row[0].split('-');if(times.length<2)continue;
    var si=tIdx(times[0].trim());
    var ei=tIdx(times[1].trim());
    if(si<0)continue;if(ei<0)ei=timeSlots.length;
    var rs=Math.max(1,ei-si);
    for(var c=1;c<row.length;c++){
      var text=row[c];if(!text)continue;
      // Check for colspan syntax "101-105:Session Name"
      var spanMatch=text.match(/^(\d{3}-\d{3}):(.+)$/);
      if(spanMatch){
        var spanRoom=spanMatch[1],spanText=spanMatch[2];
        var expanded=expandRoom(spanRoom);
        if(expanded.length>0){
          var minCI=allCols.indexOf(expanded[0]);
          var maxCI=allCols.indexOf(expanded[expanded.length-1]);
          if(minCI>=0&&maxCI>=0&&!occ[si][minCI]){
            var cs=maxCI-minCI+1;
            grid[si][minCI]={text:spanText,rowspan:rs,colspan:cs,color:propColor(spanText)};
            for(var rr=si;rr<Math.min(si+rs,timeSlots.length);rr++){
              for(var cc=minCI;cc<=maxCI;cc++){occ[rr][cc]=true;}
            }
          }
          continue;
        }
      }
      var ci=colMap[c-1];if(ci===undefined)continue;
      if(occ[si][ci])continue;
      grid[si][ci]={text:text,rowspan:rs,colspan:1,color:propColor(text)};
      for(var rr=si;rr<Math.min(si+rs,timeSlots.length);rr++){occ[rr][ci]=true;}
    }
  }
  // Render
  var h='<table class="pag"><thead><tr><th class="time-col">Time</th>';
  allCols.forEach(function(col){
    var rm=ROOMS[col];
    var booked=col==='GBR Lobby'||col==='ASEM Lobby'||bookedRooms.has(col);
    var label=col==='GBR Lobby'?'GBR<br>Lobby':col==='ASEM Lobby'?'ASEM<br>Lobby':col;
    var sub=rm?'<br><span style="font-size:9px;font-weight:400;opacity:.7">'+rm.th+'TH</span>':'';
    var sty=booked?'':'background:#e57373;color:#fff;';
    h+='<th style="'+sty+'">'+label+sub+(booked?'':'<br><span style="font-size:8px;">NOT BOOKED</span>')+'</th>';
  });
  h+='</tr></thead><tbody>';
  for(var r=0;r<timeSlots.length;r++){
    h+='<tr><td class="time-cell">'+timeSlots[r]+'</td>';
    for(var c=0;c<allCols.length;c++){
      if(grid[r]&&grid[r][c]){
        var g=grid[r][c];
        var isP=g.color==='#b0bec5';
        var cls=isP?' prep-cell':'';
        var cspan=g.colspan&&g.colspan>1?' colspan="'+g.colspan+'"':'';
        h+='<td class="session-cell'+cls+'" rowspan="'+g.rowspan+'"'+cspan+' style="'+(isP?'':'background:'+g.color+';')+'"><span class="s-name">'+g.text+'</span></td>';
      } else if(!occ[r][c]){
        var cn=allCols[c];
        var bk=cn==='GBR Lobby'||cn==='ASEM Lobby'||bookedRooms.has(cn);
        h+='<td class="'+(bk?'empty':'not-booked')+'"></td>';
      }
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  return h;
}

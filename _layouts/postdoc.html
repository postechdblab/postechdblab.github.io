---
layout: default
---
<div class="col-sm-12">
  <article class="postdoc-page">
    <a class="postdoc-back" href="{{ site.url }}{{ site.baseurl }}/">← Back to the lab</a>
    <header class="postdoc-header">
      <p class="postdoc-eyebrow">Join us</p>
      <h1>Postdoctoral Researcher</h1>
      <p class="postdoc-subtitle">Data Systems Lab <span aria-hidden="true">·</span> POSTECH</p>
    </header>
    <div class="postdoc-content">
      {{ content }}
    </div>
  </article>
</div>

<style>
  .postdoc-page {
    max-width: 820px;
    margin: 12px auto 64px;
    color: #333;
  }
  .postdoc-back {
    display: inline-block;
    margin-bottom: 28px;
    padding: 4px 0;
    color: #286090;
    font-size: 13px;
  }
  .postdoc-header {
    padding: 0 0 24px;
    margin-bottom: 28px;
    border-bottom: 1px solid #dce3e9;
  }
  .postdoc-eyebrow {
    margin: 0 0 12px;
    color: #286090;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .postdoc-header h1 {
    margin: 0 0 12px;
    font-size: 36px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -.5px;
    color: #222;
  }
  .postdoc-subtitle {
    margin: 0;
    color: #666;
    font-size: 17px;
    line-height: 1.5;
  }
  .postdoc-subtitle span { margin: 0 6px; }
  .postdoc-content {
    font-size: 15px;
    line-height: 1.75;
  }
  .postdoc-content > p { margin: 0 0 16px; }
  .postdoc-content h2 {
    margin: 36px 0 12px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
    color: #222;
  }
  .postdoc-content a { color: #286090; overflow-wrap: anywhere; }
  .postdoc-content ul { padding-left: 20px; margin: 0; }
  .postdoc-content li { padding-left: 4px; margin-bottom: 12px; }
  .postdoc-content #research-topics + p + ul {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 0;
    list-style: none;
    counter-reset: topic;
  }
  .postdoc-content #research-topics + p + ul li {
    counter-increment: topic;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px;
    margin: 0;
    border: 1px solid #e3e3e3;
    border-radius: 6px;
    background: #fafafa;
    line-height: 1.6;
  }
  .postdoc-content #research-topics + p + ul li::before {
    content: counter(topic, decimal-leading-zero);
    color: #5a7a98;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .postdoc-content #qualifications + ul {
    border-top: 1px solid #e3e3e3;
    padding-top: 20px;
  }
  .postdoc-page a:focus-visible {
    outline: 2px solid #286090;
    outline-offset: 4px;
  }
  @media (max-width: 600px) {
    .postdoc-page { margin-top: 0; margin-bottom: 40px; }
    .postdoc-back { margin-bottom: 20px; }
    .postdoc-header h1 { font-size: 28px; }
    .postdoc-subtitle { font-size: 15px; }
    .postdoc-content #research-topics + p + ul { grid-template-columns: 1fr; }
  }
</style>
